name: Build

on:
  push:
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build

      - name: Build projects
        shell: bash
        run: |
          set -e

          for project in */; do
            if [[ -f "${project}CMakeLists.txt" && "${project}" != "CrashDump/" ]]; then
              echo "========================================"
              echo "Building ${project}"
              echo "========================================"

              cmake \
                -S "${project}" \
                -B "${project}build/ci" \
                -G Ninja \
                -DCMAKE_CXX_COMPILER=clang++ \
                -DCMAKE_BUILD_TYPE=Debug

              cmake --build "${project}build/ci"
            fi
          done

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CrashDump
        run: >
          cmake
          -S CrashDump
          -B CrashDump/build/ci
          -G Ninja
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build CrashDump
        run: cmake --build CrashDump/build/ci